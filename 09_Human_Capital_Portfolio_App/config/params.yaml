# Every parameter and assumption of the project.
# Every module reads its settings from here, so the app, the model and the
# backtest always use the same assumptions.

data:
  start_date: "2000-01-01"   # early start so 2008 is out-of-sample (first 60-month window ends ~2005)
  base_currency: "CHF"
  frequency: "monthly"       # all returns are month-end to month-end, simple returns, decimals
  folder: "data"             # saved copies, so the app works offline
  max_abs_monthly_return_ticker: 0.60   # cleaning: a single stock/ETF above this in one month = data error (set to NaN)
  warn_abs_monthly_return: 0.40         # report: asset months above this are printed for a manual check

  # ---------------------------------------------------------------------------
  # Version 1 investable universe (the keys are the column names).
  # Each asset has an ordered list of sources. The FIRST source has priority
  # wherever it has data; the next sources only fill the months it is missing
  # (before it starts, after it ends, or a month removed by the cleaning).
  # Every series is converted to CHF. data/coverage.csv shows what was used.
  # ---------------------------------------------------------------------------
  assets:
    EQ_WORLD:
      label: "World equities"
      sources:
        - {type: yahoo, tickers: ["URTH"], currency: USD}                  # iShares MSCI World (from 2012)
        - {type: kf_market, file: "Developed_3_Factors", currency: USD}    # Ken French developed markets (from 1990)
    BANKS_EU:
      label: "European banks (the banker's sector)"
      sources:
        - {type: yahoo, tickers: ["EXV1.DE"], currency: EUR}               # iShares STOXX Europe 600 Banks (Yahoo history from 2008)
        - {type: yahoo, tickers: ["BNP.PA", "SAN.MC", "DBK.DE", "INGA.AS", "BBVA.MC", "GLE.PA", "ISP.MI"], currency: EUR}  # equal-weight large euro-area banks, before 2008
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Banks", currency: USD}  # last resort: US banks
    EQ_CH:
      label: "Swiss equities"
      sources:
        - {type: yahoo, tickers: ["EWL"], currency: USD}                   # iShares MSCI Switzerland (from 1996)
    BOND_CHF:
      label: "CHF government bonds"
      sources:
        - {type: yahoo, tickers: ["CSBGC0.SW"], currency: CHF}               # iShares Swiss Domestic Government Bond 7-15 (CH): real ETF, month-end prices
        - {type: snb_yield, cube: "rendoblim", code: "10J", duration: 9.0}  # before the ETF exists: synthetic index from the SNB 10y Confederation yield
    BOND_GLB_H:
      label: "Global bonds (US Treasuries, hedged to CHF)"
      sources:
        - {type: fred_yield, series: "DGS10", duration: 8.0, currency: USD, hedged: true, foreign_rf: "DTB3"}   # daily, month-end value
    REIT_CH:
      label: "Swiss real estate"
      sources:
        - {type: yahoo, tickers: ["PSPN.SW", "SPSN.SW", "ALLN.SW"], currency: CHF}   # equal-weight listed property companies
    GOLD:
      label: "Gold"
      sources:
        - {type: yahoo, tickers: ["GLD"], currency: USD}                   # SPDR Gold (from 2004)
        - {type: yahoo, tickers: ["GC=F"], currency: USD}                  # gold futures (from 2000)
    EMPLOYER:
      label: "Employer stock (UBS)"
      sources:
        - {type: yahoo, tickers: ["UBSG.SW"], currency: CHF}               # history from 1999
        - {type: yahoo, tickers: ["UBS"], currency: USD}                   # NYSE listing, fallback only

  # ---------------------------------------------------------------------------
  # Sector menu: one investable sector per type of career, already downloaded, so a new
  # client (a dentist, an engineer...) can be shown live without any download.
  # Saved in data/sectors_chf.csv (load_sector_returns). US Select Sector SPDR ETFs,
  # all available since December 1998, converted to CHF; Ken French industries before.
  # ---------------------------------------------------------------------------
  sectors:
    SEC_FIN:
      label: "Financials"
      sources:
        - {type: yahoo, tickers: ["XLF"], currency: USD}
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Fin", currency: USD}
    SEC_TECH:
      label: "Technology"
      sources:
        - {type: yahoo, tickers: ["XLK"], currency: USD}
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Softw", currency: USD}
    SEC_HEALTH:
      label: "Health care"
      sources:
        - {type: yahoo, tickers: ["XLV"], currency: USD}
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Hlth", currency: USD}
    SEC_INDU:
      label: "Industrials"
      sources:
        - {type: yahoo, tickers: ["XLI"], currency: USD}
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Mach", currency: USD}
    SEC_CONS:
      label: "Consumer discretionary (retail, hotels, restaurants)"
      sources:
        - {type: yahoo, tickers: ["XLY"], currency: USD}
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Rtail", currency: USD}
    SEC_STAPLES:
      label: "Consumer staples"
      sources:
        - {type: yahoo, tickers: ["XLP"], currency: USD}
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Food", currency: USD}
    SEC_ENERGY:
      label: "Energy"
      sources:
        - {type: yahoo, tickers: ["XLE"], currency: USD}
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "Oil", currency: USD}
    SEC_MATERIALS:
      label: "Materials and construction"
      sources:
        - {type: yahoo, tickers: ["XLB"], currency: USD}
        - {type: kf_industry, file: "49_Industry_Portfolios", column: "BldMt", currency: USD}

  # ---------------------------------------------------------------------------
  # Version 2 universe (the one the app uses): world equities split into the 12 Fama-French
  # industries, so the client's own industry can be left out, plus corporate bonds and
  # commodities as diversifiers. Saved in data/universe2_chf.csv (load_universe2_returns).
  # Industries: value-weighted US portfolios (Kenneth French), converted to CHF.
  # ---------------------------------------------------------------------------
  universe2:
    IND_NODUR:
      label: "Consumer non-durables (food, drinks, household goods)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "NoDur", currency: USD}
    IND_DURBL:
      label: "Consumer durables (cars, appliances, furniture)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Durbl", currency: USD}
    IND_MANUF:
      label: "Manufacturing (machinery, industrial goods)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Manuf", currency: USD}
    IND_ENRGY:
      label: "Energy (oil, gas, coal)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Enrgy", currency: USD}
    IND_CHEMS:
      label: "Chemicals"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Chems", currency: USD}
    IND_BUSEQ:
      label: "Business equipment (computers, software, electronics)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "BusEq", currency: USD}
    IND_TELCM:
      label: "Telecom (telephone and television)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Telcm", currency: USD}
    IND_UTILS:
      label: "Utilities"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Utils", currency: USD}
    IND_SHOPS:
      label: "Shops (retail, wholesale, some services)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Shops", currency: USD}
    IND_HLTH:
      label: "Health care (medical equipment, drugs)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Hlth", currency: USD}
    IND_MONEY:
      label: "Finance (banks, insurance, trading)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Money", currency: USD}
    IND_OTHER:
      label: "Other (mines, construction, transport, hotels, business services)"
      sources:
        - {type: kf_industry, file: "12_Industry_Portfolios", column: "Other", currency: USD}
    BOND_CORP:
      label: "Corporate bonds (US investment grade, hedged to CHF)"
      sources:
        - {type: yahoo, tickers: ["LQD"], currency: USD, hedged: true, foreign_rf: "DTB3"}     # iShares iBoxx $ IG (from 2002)
        - {type: fred_yield, series: "AAA", duration: 8.0, currency: USD, hedged: true, foreign_rf: "DTB3"}  # before: synthetic from Moody's Aaa corporate yield (FRED, monthly since 1919)
    COMMOD:
      label: "Commodities (S&P GSCI)"
      sources:
        - {type: yahoo, tickers: ["GSG"], currency: USD}                   # iShares S&P GSCI Commodity (from 2006)
        - {type: yahoo, tickers: ["^SPGSCI"], currency: USD}               # S&P GSCI index, before the ETF

  # Which asset plays which role in the career model
  career_bond_asset: "BOND_CHF"     # R_B
  career_sector_asset: "BANKS_EU"   # R_S of the default client (each persona has its own, see personas)

  # ---------------------------------------------------------------------------
  # Rates and exchange rates
  # ---------------------------------------------------------------------------
  rates:
    RF_CHF: {type: snb_rate, cube: "zimoma", code: "SARON"}   # CHF risk-free rate (annual %, can be negative)
  fx:                                   # FRED daily series, month-end value
    USDCHF: "DEXSZUS"                   # CHF per 1 USD
    EURUSD: "DEXUSEU"                   # USD per 1 EUR  (EURCHF = USDCHF x EURUSD)

client:                      # default persona: the Zurich banker
  persona: "banker"          # one of the personas below
  age: 35
  retirement_age: 65
  salary_chf: 130000         # gross annual salary, mid-career banker in Zurich (assumption, slider in the app)
  portfolio_chf: 100000      # financial portfolio F (CHF), deferred shares included
  pillar2: true              # false for the self-employed (no pension fund)
  pension_chf: auto          # 2nd-pillar savings P (CHF). "auto" = estimated with the legal BVG rules (section
                             # pension below); a number = the amount on the client's pension certificate
  deferred_shares_chf: 15000 # employer shares (UBS) that cannot be sold yet: the lock-up. 0 = no employer stock.
                             # Assumption: about 15% of the portfolio for a mid-career banker (slider in the app)

# Presets for the app: change the client in seconds. sector = the asset R_S of the career
# (BANKS_EU or a column of the sector menu; null = no sector exposure).
# beta_sector is an assumption (wages have no market price, so it cannot be estimated from
# the client's own data): small values on purpose, because overestimating it is costly
# and underestimating it is not. pillar2 = false for self-employed.
# deferred_shares_chf: employer shares under lock-up (only the banker: the employer stock is UBS).
# Version 2 (src/allocation.py): industry = the client's Fama-French industry (null = none),
# variable_pay = share of pay that moves with the industry (bonus, business income), stake_chf = shares
# of the employer or own business already held (part of the savings), unlock_years = when they can be sold.
personas:
  banker:           {label: "Banker, Zurich",          age: 35, salary_chf: 130000, sector: "BANKS_EU",   beta_sector: 0.15, pillar2: true, deferred_shares_chf: 15000, industry: "IND_MONEY", variable_pay: 0.30, stake_chf: 15000, unlock_years: 3}
  tech_engineer:    {label: "Software engineer",       age: 32, salary_chf: 140000, sector: "SEC_TECH",   beta_sector: 0.15, pillar2: true, industry: "IND_BUSEQ", variable_pay: 0.20, stake_chf: 20000, unlock_years: 2}
  dentist:          {label: "Dentist, self-employed",  age: 40, salary_chf: 180000, sector: "SEC_HEALTH", beta_sector: 0.05, pillar2: false, industry: "IND_HLTH", variable_pay: 0.30, stake_chf: 0, unlock_years: 0}
  factory_engineer: {label: "Engineer in industry",    age: 45, salary_chf: 115000, sector: "SEC_INDU",   beta_sector: 0.10, pillar2: true, industry: "IND_MANUF", variable_pay: 0.10, stake_chf: 10000, unlock_years: 3}
  shop_owner:       {label: "Shop owner (florist)",    age: 38, salary_chf: 75000,  sector: "SEC_CONS",   beta_sector: 0.10, pillar2: false, industry: "IND_SHOPS", variable_pay: 0.50, stake_chf: 0, unlock_years: 0}
  builder:          {label: "Construction worker",     age: 30, salary_chf: 80000,  sector: "SEC_MATERIALS", beta_sector: 0.10, pillar2: true, industry: "IND_OTHER", variable_pay: 0.10, stake_chf: 0, unlock_years: 0}
  energy_worker:    {label: "Energy sector employee",  age: 35, salary_chf: 110000, sector: "SEC_ENERGY", beta_sector: 0.15, pillar2: true, industry: "IND_ENRGY", variable_pay: 0.20, stake_chf: 25000, unlock_years: 3}
  civil_servant:    {label: "Civil servant",           age: 35, salary_chf: 100000, sector: null,         beta_sector: 0.00, pillar2: true, industry: null, variable_pay: 0.0, stake_chf: 0, unlock_years: 0}

# Career model:
#   career excess return = beta_bond x (BOND_CHF - rf) + beta_sector x (BANKS_EU - rf) + noise
#   H = present value of the remaining salary until retirement
career:
  beta_bond: auto            # "auto" = duration rule: (1 - wage_rate_link) x modified duration of the salary
                             # stream / duration of BOND_CHF. A number here overrides the rule.
  wage_rate_link: 0.5        # share of interest-rate moves that salaries follow (0 to 1). When rates rise with
                             # inflation, wages tend to rise too, so the salary is NOT a fixed nominal bond.
                             # 0 = salary treated as a fixed nominal bond (civil servant looks riskier than the
                             # banker, unrealistic); 1 = no interest-rate risk at all. Group choice, slider in the app.
  beta_sector: 0.15          # how much the career moves with the sector. Conservative on purpose:
                             # overestimating it is costly, underestimating it is not
  bond_duration: 9.0         # modified duration of the bond index R_B (BOND_CHF = 7-15y CHF government bonds)
  salary_growth: 0.015       # nominal salary growth per year
  rf_long_run: 0.01          # long-run CHF risk-free rate used to discount the salary (annual)
  bond_premium: 0.01         # expected excess return of R_B (annual)
  sector_premium: 0.05       # expected excess return of R_S (annual)
  # discount rate of H = rf_long_run + beta_bond x bond_premium + beta_sector x sector_premium
  idiosyncratic_vol: 0.0     # personal career risk (promotion, job change), annual volatility, uncorrelated with
                             # markets. It does not change the optimal portfolio, only the split of total-wealth
                             # risk. 0 = only the market part of the career, as in the backtest

# 2nd pillar (BVG/LPP), used when client.pension_chf is "auto": savings built with the legal
# minimum rules from start_age until today, with past salaries scaled back by salary_growth.
# The account is credited at a guaranteed rate, so the pension has no market risk: it enlarges
# omega, the non-tradable share of wealth, but adds no hedging demand.
pension:
  start_age: 25                       # age credits start at 25 (BVG, art. 16)
  age_credits: {25: 0.07, 35: 0.10, 45: 0.15, 55: 0.18}   # % of the coordinated salary from each age on (BVG, art. 16)
  coordination_deduction: 26460       # CHF, 2025-2026 (BSV key figures)
  max_insured_salary: 90720           # CHF, upper limit of the mandatory salary, 2025-2026 (BSV key figures)
  interest_rate: 0.0125               # BVG minimum interest rate 2024-2026 (BSV); raised to 2.0% from 2027

# Optimizer. gamma = risk TOLERANCE, lab convention:
#   minimise 0.5 x Var(R_W) - gamma x E(R_W)   on total wealth W = H + P + F
optimization:
  gamma: auto                # "auto" = calibrated once with fsolve (as in lab LN1): a client with no career and no
                             # pension holds a portfolio as risky as calibration_portfolio. A number overrides it.
  calibration_portfolio: {EQ_WORLD: 0.60, BOND_CHF: 0.40}   # the 60/40 benchmark
  covariance: ledoit_wolf    # "ledoit_wolf" (shrinkage to constant correlation, LN3) or "sample"
  long_only: true            # x >= 0
  max_leverage: 1.0          # 1'x <= 1: no borrowing, the rest of the portfolio is cash. null = no limit
  # Diversification caps ("sector caps"): at most 10% of the portfolio in one sector or one
  # stock. Without them a young client, who is almost risk-neutral on a portfolio that is 3% of his wealth,
  # puts everything in the single asset with the highest expected return (corner solution). The lock-up
  # can be above the cap: the deferred shares are held, never bought.
  position_caps: {BANKS_EU: 0.10, EMPLOYER: 0.10, SEC_FIN: 0.10, SEC_TECH: 0.10, SEC_HEALTH: 0.10,
                  SEC_INDU: 0.10, SEC_CONS: 0.10, SEC_STAPLES: 0.10, SEC_ENERGY: 0.10, SEC_MATERIALS: 0.10}

# Expected returns: Black-Litterman as in lab LN4
#   prior: pi = phi x Sigma x w_mkt, with phi = sharpe_ratio / volatility of w_mkt (the MARKET's risk aversion)
#   views: P mu = Q + e, e ~ N(0, Omega), prior uncertainty Gamma = tau x Sigma
black_litterman:
  # Global market portfolio: Doeswijk and Swinkels (2024), "The Risk and Reward of Investing",
  # Robeco working paper, Table 1: average weights 1970-2022, mapped to our universe.
  market_weights:
    EQ_WORLD: 0.497          # equities (the world index already holds Swiss equities and banks: no double counting)
    BOND_GLB_H: 0.435        # government bonds 28.1% + non-government bonds 15.4%
    REIT_CH: 0.044           # real estate
    GOLD: 0.024              # commodities
  sharpe_ratio: 0.408        # Sharpe ratio of the global market portfolio 1970-2022, annual (same paper, Table 2)
  tau: 0.05                  # uncertainty of the prior (lab LN4 starting value)
  views: []                  # optional client views, annual numbers, for example:
                             #   - {assets: {EQ_CH: 1.0}, q: 0.05, sd: 0.10}                   Swiss equities earn 5% over cash
                             #   - {assets: {EQ_CH: 1.0, EQ_WORLD: -1.0}, q: 0.01, sd: 0.05}   Swiss beat world equities by 1%

# Backtest: the client of params (the banker, 35 at the start) followed month
# by month, each strategy decided with the past window only.
backtest:
  window_months: 60          # estimation window: the first decision (Sep 2005) uses Sep 2000 - Aug 2005
  transaction_cost_bp: 10    # cost = 10 bp x turnover
  savings_rate: 0.10         # share of the gross salary added to the portfolio each month (assumption, slider)
  job_loss_months: 12        # job-loss variant: months without salary after the job is lost
  job_loss_thresholds: [0.20, 0.30, 0.40]   # the job is lost when the client's sector falls this much below its
                                            # peak (30% central value); none in the main backtest
  wrong_beta_multipliers: [0.0, 0.5, 1.0, 1.5, 2.0]   # true beta_sector = multiplier x assumed
  hedge_map_portfolios: [100000, 300000, 1000000, 3000000]   # hedge map: starting
  hedge_map_betas: [0.15, 0.30, 0.60]                         # portfolio x beta_sector, both known to the adviser
  worst_months_share: 0.10   # "bad months" = the worst 10% months of the sector part of the career
  bootstrap_block: 12        # circular block bootstrap: blocks of 12 months (crises last several months)
  bootstrap_draws: 5000
  bootstrap_seed: 0          # fixed: the backtest gives the same numbers on every run
  crises:                    # first and last month, both included
    "2008 financial crisis": ["2008-09", "2009-02"]
    "2011 euro crisis": ["2011-07", "2011-09"]
    "Jan 2015 CHF shock": ["2015-01", "2015-01"]
    "COVID 2020": ["2020-02", "2020-03"]
    "2022 rates and inflation": ["2022-01", "2022-09"]
    "Credit Suisse 2023": ["2023-03", "2023-03"]
  # Robustness of the prior: a Swiss pension-fund neutral portfolio instead of the global market
  # portfolio. Pictet LPP-40 (2015 family) mapped onto our assets: CHF bonds 30,
  # hedged world bonds 10 + euro corporates 5, Swiss equities 15, global equities 20 + small caps 5 (of
  # which banks 2.5), Swiss real estate 5; emerging bonds and hedge funds (no asset) removed. In %, rescaled.
  swiss_prior: {BOND_CHF: 30.0, BOND_GLB_H: 15.0, EQ_CH: 15.0, EQ_WORLD: 22.5, BANKS_EU: 2.5, REIT_CH: 5.0}

# App (step 5): what the client can enter in the side panel, and how the page is drawn.
app:
  jobs:                      # the job menu: one persona each (labels for the client)
    banker: "Banking"
    tech_engineer: "Technology"
    dentist: "Dentist, self-employed"
    factory_engineer: "Industry"
    shop_owner: "Shop owner, self-employed"
    builder: "Construction"
    energy_worker: "Energy"
    civil_servant: "Public sector"
  industry_names:            # version 2: the 12 industries as the client reads them (None = no industry)
    IND_NODUR: "Food, drinks and household goods"
    IND_DURBL: "Cars and household appliances"
    IND_MANUF: "Manufacturing and machinery"
    IND_ENRGY: "Energy"
    IND_CHEMS: "Chemicals and materials"
    IND_BUSEQ: "Technology"
    IND_TELCM: "Telecom and media"
    IND_UTILS: "Utilities"
    IND_SHOPS: "Retail and services"
    IND_HLTH: "Health care"
    IND_MONEY: "Finance (banks, insurance)"
    IND_OTHER: "Construction, transport and other"
  no_industry: "Public sector, or pay not linked to an industry"
  variable_pay_step: 0.05
  unlock_max_years: 10
  pension_step: 5000          # pension fund savings field: step, CHF (no upper limit)
  sector_words:              # the client's sector in a sentence ("when ... do badly")
    BANKS_EU: "European banks"
    SEC_FIN: "financial companies"
    SEC_TECH: "tech companies"
    SEC_HEALTH: "health care companies"
    SEC_INDU: "industrial companies"
    SEC_CONS: "shops, hotels and restaurants"
    SEC_STAPLES: "food and household companies"
    SEC_ENERGY: "energy companies"
    SEC_MATERIALS: "construction and materials companies"
  age_range: [20, 64]        # 64: at least one year of career left before retirement_age
  salary_step: 5000          # salary, savings and pension have no upper limit; employer shares at most the savings
  savings_min: 5000          # savings must stay above 0: the plan divides by them
  savings_step: 5000
  shares_step: 1000
  # "How much does your pay follow your industry?": multiplier of the persona's beta_sector
  # (the same range as the wrong-beta test of the backtest)
  sector_link: {"Not at all": 0.0, "A little": 1.0, "A lot": 2.0}
  sector_link_default: "A little"
  glide_step_years: 2        # the plan by age is optimised again every 2 years until retirement
  range_paths: 4000          # "What you might have": simulated markets for the range of the savings at retirement
  min_weight: 0.0005         # holdings below 0.05% are not shown
  bond_gap: 0.05             # the page says "your job already does that for you" when typical advice holds at
                             # least 5 points more bonds than ours
  bonds_visible: 0.01        # "then bonds come in": the first age with at least 1% in bonds
  significance: 0.05         # a p-value above 5% is called "less certain"
  labels_apart: 0.08         # backtest chart: the end labels move apart when the two lines end within 8%
  poll_seconds: 1            # while the backtest runs in the background, the page checks every second
  risk_other: 0.005          # tab Risk: pieces below 0.5% of the risk are shown together as "Other"
  # Advanced settings (side panel)
  cap_range: [0.05, 0.05]    # most in one sector or stock: minimum and step of the slider
  view_return_range: [-0.05, 0.15, 0.005]   # Black-Litterman view: min, max, step (annual, above cash)
  view_default: 0.05
  view_confidence: {Low: 0.10, Medium: 0.05, High: 0.02}   # sd of the view

# Version 2 allocation (src/allocation.py): risk budgeting on the savings (LN5-LN6),
# with the client's stake fixed, the own industry left out, bonds reduced by the bond-like part of
# wealth (career and pension), and a loss limit before retirement.
allocation:
  groups:
    equities: [IND_NODUR, IND_DURBL, IND_MANUF, IND_ENRGY, IND_CHEMS, IND_BUSEQ, IND_TELCM, IND_UTILS,
               IND_SHOPS, IND_HLTH, IND_MONEY, IND_OTHER, EQ_CH]
    real: [REIT_CH, GOLD, COMMOD]
    bonds: [BOND_CHF, BOND_GLB_H, BOND_CORP]
  # Risk profile:
  #   safe_share: share of the savings in bonds for a client whose wealth is only savings. Our plan (C)
  #     multiplies it by (1 - bond-like share of wealth): the career's bond part and the pension already
  #     are safe. Typical advice (A) uses it as it is.
  #   equities / real: risk budgets of the growth part (they add up to 1)
  #   loss_tolerance: bad-year loss accepted, in % of the savings (the loss limit adds what can still be
  #     saved before retirement)
  #   Typical advice (A) is the profile's model portfolio: prudent 45/55, balanced 60/40, dynamic 75/25
  #   (growth/bonds). Our plan (C) starts from the same bonds, so the gain of (C) over (A) is only the job.
  profiles:
    prudent:  {safe_share: 0.55, equities: 0.80, real: 0.20, loss_tolerance: 0.05}
    balanced: {safe_share: 0.40, equities: 0.85, real: 0.15, loss_tolerance: 0.08}
    dynamic:  {safe_share: 0.25, equities: 0.90, real: 0.10, loss_tolerance: 0.12}
  default_profile: balanced
  loss_confidence: 0.95      # "bad year" = 1 year in 20 (Gaussian, LN6)
  reserve_months: 0          # cash kept aside before investing, in months of gross salary. 0: the app asks for the
                             # savings TO INVEST, after the client's own emergency fund
  stake_idio_vol: 0.25       # company-specific volatility of the stake on top of its industry (single large stock)
  sharpe_floor: 0.25         # inside a group, budgets follow the Black-Litterman Sharpe ratios, at least 25% of the
                             # group's average, so no asset is dropped because of a low expected return
  # Black-Litterman prior for this universe: Doeswijk and Swinkels (2024) shares (equities 49.7%, government
  # bonds 28.1%, other bonds 15.4%, real estate 4.4%, commodities 2.4%), equities split by MSCI World sector
  # weights (factsheet, 30 Sep 2026), mapped to the Fama-French industries. 0 = no weight in the prior
  # (implied return from its covariance with the market).
  market_weights:
    equities_share: 0.497
    sector_weights:          # GICS sector -> Fama-French industry, MSCI World, 30 Sep 2026
      IND_BUSEQ: 0.3178      # information technology
      IND_MONEY: 0.1726      # financials 15.74% + real estate 1.52%
      IND_MANUF: 0.1080      # industrials
      IND_HLTH: 0.0920       # health care
      IND_SHOPS: 0.0836      # consumer discretionary
      IND_TELCM: 0.0831      # communication services
      IND_NODUR: 0.0477      # consumer staples
      IND_ENRGY: 0.0403      # energy
      IND_CHEMS: 0.0321      # materials
      IND_UTILS: 0.0230      # utilities
    BOND_GLB_H: 0.281
    BOND_CORP: 0.154
    REIT_CH: 0.044
    GOLD: 0.012
    COMMOD: 0.012
  rebalance_months: 3        # backtest: the plan is solved again every 3 months (holdings drift in between)
  view_years: 3              # a client's market view is an opinion about the next years, not forever: it counts fully
                             # today, fades to nothing over 3 years in the plan by age, and the backtest never uses
                             # it (nobody knew it in 2005)

