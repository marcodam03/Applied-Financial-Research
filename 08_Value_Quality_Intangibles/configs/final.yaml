# Config of the FINAL strategy, qvi_timely (docs/STRATEGY.md).
#   python scripts/run_signal.py --signal qvi_timely --config configs/final.yaml
#   python scripts/run_final_analysis.py          (everything, with this config)
#
# - Sample 1963-07 to 2015-12 for the research ("train" = 1963-1994, "validation" =
#   1995-2015). The test period 2016-2025 is the holdout: run_signal.py never shows it
#   without --holdout (HOLDOUT_START in run_signal.py), whatever this file says.
# - Universe: US common stocks above the NYSE 20th size percentile (no microcaps).
# - Deciles on NYSE breakpoints, long decile 10, short decile 1, equal- and
#   value-weighted. The signal is monthly, but the portfolios are formed every
#   3 months (end of March, June, September, December) and held meanwhile.
# - Trading costs: half the closing bid-ask spread + price impact, fund of $100m
#   per side in 2025 dollars (src/portfolio/costs.py).
# - Robustness: with microcaps, large caps only, formed every 1 or 6 months, and a
#   turnover buffer.

data:
  factors: data/external/factors_monthly.csv

periods:
  train: ["1963-07", "1994-12"]        # first half
  validation: ["1995-01", "2015-12"]   # second half
  test: ["2016-01", "2025-12"]         # holdout, only with --holdout

universe:
  min_price: null
  min_nyse_size_pct: 0.2
  exclude_financials: false
  exclude_utilities: false

portfolio:
  n_portfolios: 10            # deciles
  nyse_breakpoints: true
  weighting: [ew, vw]
  buffer: 0                   # turnover buffer, 0 = off
  hold_months: 3              # monthly signals: sort every 3 months, hold meanwhile

costs:
  # Every trade pays half the stock's closing bid-ask spread on the formation date
  # (CRSP daily quotes; before 1993 an estimate for NYSE/AMEX stocks, see
  # src/data/cost_inputs.py) plus a price impact that is larger for small stocks
  # and big trades (src/portfolio/costs.py, professor's slides 21-24).
  price_impact: true          # false = spread only
  aum_musd: 100               # fund size per leg, $m, in aum_ref_month
  aum_ref_month: "2025-12"
  aum_scale: volume           # fund moves back in time with the market's dollar volume
                              #   (same share of trading) | market_cap
  impact_shape: linear        # linear (slides: lambda x % of daily volume) | sqrt
  execution_days: 1           # days to execute a rebalancing (less volume per day)

evaluation:
  models: [CAPM, FF5, FF6, q5, q5+STR]
  headline_models: [CAPM, FF5, q5, q5+STR]
  newey_west_lags: 6
  # periods for alphas and robustness tables (full sample + zoom on recent years)
  alpha_periods:
    full: ["1963-07", "2025-12"]
    last30: ["1995-01", "2025-12"]
    last20: ["2005-01", "2025-12"]

robustness:
  all_stocks: {min_nyse_size_pct: null}   # with microcaps
  large_caps: {min_nyse_size_pct: 0.5}    # above the NYSE median
  hold1: {hold_months: 1}                 # sort every month
  hold6: {hold_months: 6}                 # sort every 6 months
  hold3_buffer2: {buffer: 2}              # every 3 months + turnover buffer
